[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mgnrega-employment-delivery-diagnostic"
version = "0.1.0"
description = "A transparent MGNREGA district-year analytics pipeline and Streamlit dashboard"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
